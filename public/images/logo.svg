<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 44" fill="none" aria-label="Dietz C&C">

  <!-- Icon: cyan rounded square -->
  <rect x="0" y="2" width="40" height="40" rx="9" fill="#06B6D4"/>

  <!-- Code brackets: < > -->
  <polyline points="13,14 7,22 13,30" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="27,14 33,22 27,30" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: "Dietz" dark + "C&C" cyan, single baseline -->
  <text x="52" y="29"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="700"
    letter-spacing="-0.6">
    <tspan fill="#0A0A0A">Dietz </tspan><tspan fill="#06B6D4" font-weight="600" letter-spacing="-0.2">C&amp;C</tspan>
  </text>

  <!-- Tagline -->
  <text x="53" y="41"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="8.5"
    font-weight="500"
    fill="#A3A3A3"
    letter-spacing="1.8">CODE &amp; CONTROL</text>

</svg>
